services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: elite-web
    # Bound to localhost only — Caddy (below) fronts the public domain over HTTPS.
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/data/prod.db
      # REQUIRED: generate with `openssl rand -base64 32`
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your environment or a .env file}
      # Optional real-time notifications (Pusher). Leave unset to disable.
      PUSHER_APP_ID: ${PUSHER_APP_ID:-}
      PUSHER_KEY: ${PUSHER_KEY:-}
      PUSHER_SECRET: ${PUSHER_SECRET:-}
      PUSHER_CLUSTER: ${PUSHER_CLUSTER:-us2}
      NEXT_PUBLIC_PUSHER_KEY: ${NEXT_PUBLIC_PUSHER_KEY:-}
      NEXT_PUBLIC_PUSHER_CLUSTER: ${NEXT_PUBLIC_PUSHER_CLUSTER:-us2}
      # Email (password reset, welcome, deposit decisions). Unset SMTP_HOST =
      # emails are logged to the container console instead of sent.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      MAIL_FROM: ${MAIL_FROM:-Elite Forex Hub <no-reply@${DOMAIN:-localhost}>}
      APP_URL: ${APP_URL:-https://${DOMAIN:-localhost}}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
    volumes:
      - elite-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Reverse proxy with automatic HTTPS (Let's Encrypt). Opt-in:
  #   DOMAIN=app.example.com docker compose --profile proxy up -d --build
  caddy:
    image: caddy:2-alpine
    profiles: ["proxy"]
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN (e.g. app.example.com) to use the proxy}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  elite-data:
  caddy-data:
  caddy-config:
